name: Build Web Assets

on:
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装官方压缩工具
        run: |
          npm install -g terser lightningcss-cli

      - name: 提取、合并、极限压缩
        run: |
          # 1. 准备全新的 dist 目录
          mkdir -p dist
          rsync -av --exclude='.git' --exclude='node_modules' --exclude='.github' --exclude='android' --exclude='dist' ./ dist/
          cd dist

          # ==========================
          # 处理 CSS (只提取 css/ 和 add/)
          # ==========================
          grep -oP '(?<=<link rel="stylesheet" href=")[^"]+' index.html | grep -E '^(css/|add/)' | sed 's/?[^ ]*//g' | sed 's|^/||' > css_list.txt
          cat $(cat css_list.txt) > all.css
          lightningcss --minify all.css -o all.css
          
          # ⚠️ 分隔符换成 #
          sed -i 's#<link rel="stylesheet" href="[^"]*">##g' index.html
          sed -i 's#</head>#<link rel="stylesheet" href="all.css">\n</head>#' index.html
          rm css_list.txt

          # ==========================
          # 处理 JS (只提取 js/ 和 add/)
          # ==========================
          grep -oP '(?<=<script src=")[^"]+' index.html | grep -E '^(js/|add/)' | sed 's/?[^ ]*//g' | sed 's|^/||' > js_list.txt
          cat $(cat js_list.txt) > all.js
          
          # ⚠️ 核心修复：把包含 | 的正则改由 # 作为分隔符
          sed -i -E 's#<script src="(js/|add/)[^"]*"[^>]*></script>##g' index.html
          sed -i 's#</body>#<script src="all.js"></script>\n</body>#' index.html
          rm js_list.txt

          # ★ 核心：无白名单，直接开启 toplevel 极限压缩
          terser all.js -c toplevel=true,drop_console=true -m toplevel=true -o all.js

      - name: 上传前端打包产物
        uses: actions/upload-artifact@v4
        with:
          name: Web-Production-Build
          path: dist/