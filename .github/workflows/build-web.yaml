name: Build Web Assets

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: 缓存 NPM
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 安装官方压缩工具
        run: |
          npm install -g terser lightningcss-cli

      - name: 合并压缩并生成纯净导出
        run: |
          mkdir -p dist
          
          # ==========================
          # 处理 CSS
          # ==========================
          grep -oP '(?<=<link rel="stylesheet" href=")[^"]+' index.html | sed 's/?[^ ]*//g' | grep -E '^(css/|add/)' > css_list.txt
          if [ -s css_list.txt ]; then
            mkdir -p dist/css
            cat $(cat css_list.txt) > dist/css/all.css
            
            sed -i 's|\.\./|/|g' dist/css/all.css

            cat > /tmp/replace-has.cjs <<'EOF'
          const fs = require('fs');
          let css = fs.readFileSync('dist/css/all.css', 'utf8');
          const ids = new Set();
          css = css.replace(/body:has\(#([\w-]+):not\(\.hidden\)\)/g, (_, id) => {
            ids.add(id);
            return 'body.' + id + '-mode';
          });
          fs.writeFileSync('dist/css/all.css', css);
          fs.writeFileSync('/tmp/has-ids.json', JSON.stringify([...ids]));
          console.log('has replaced:', ids.size, 'ids ->', [...ids].join(','));
          EOF
            node /tmp/replace-has.cjs

            lightningcss --minify dist/css/all.css -o dist/css/all.css
          fi
          rm -f css_list.txt

          # ==========================
          # 处理 JS
          # ==========================
          grep -oP '(?<=<script src=")[^"]+' index.html | sed 's/?[^ ]*//g' | grep -E '^(js/|add/)' > js_list.txt
          if [ -s js_list.txt ]; then
            mkdir -p dist/js

            cat > /tmp/gen-sync.cjs <<'EOF'
          const fs = require('fs');
          let ids = [];
          try { ids = JSON.parse(fs.readFileSync('/tmp/has-ids.json', 'utf8') || '[]'); } catch (e) {}
          if (!ids.length) { fs.writeFileSync('/tmp/sync-modes.js', ''); process.exit(0); }
          const code = "(function(){'use strict';var m=" + JSON.stringify(ids) + ";for(var i=0;i<m.length;i++){(function(id){var el=document.getElementById(id);if(!el)return;var c=id+'-mode';var u=function(){document.body.classList.toggle(c,!el.classList.contains('hidden'))};u();new MutationObserver(u).observe(el,{attributes:true,attributeFilter:['class']})})(m[i])}})();";
          fs.writeFileSync('/tmp/sync-modes.js', code);
          EOF
            node /tmp/gen-sync.cjs

            cat /tmp/sync-modes.js $(cat js_list.txt) > dist/js/all.js
            terser dist/js/all.js -c drop_console=true,passes=2 -m -o dist/js/all.js
          fi
          rm -f js_list.txt

          # ==========================
          # 修改 index.html 并放入导出目录
          # ==========================
          cp index.html dist/index.html
          
          sed -i -E 's#<link rel="stylesheet" href="(css/|add/)[^"]*">##g' dist/index.html
          sed -i 's#</head>#<link rel="stylesheet" href="css/all.css">\n</head>#' dist/index.html
          
          sed -i -E 's#<script src="(js/|add/)[^"]*"[^>]*></script>##g' dist/index.html
          sed -i 's#</body>#<script src="js/all.js" defer></script>\n</body>#' dist/index.html

          rsync -av 背景 卡牌 图标 字体 dist/

      # 删除了原来在此处的「极简 JSON 清洗」步骤，因为 data.json 已经由 finalize.py 精简

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 缓存 pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装 fonttools
        run: pip install fonttools brotli

      - name: 字体子集化
        run: |
          python3 - <<'PY'
          import os, re, sys
          from fontTools.subset import main as subset_main
          from fontTools.ttLib import TTFont

          chars = set()
          pattern = re.compile(r'\S')
          for root, _, files in os.walk('dist'):
              for f in files:
                  if f.endswith(('.html', '.js')):
                      try:
                          text = open(os.path.join(root, f), encoding='utf-8').read()
                          chars.update(pattern.findall(text))
                      except Exception:
                          pass

          text = ''.join(sorted(chars))
          open('/tmp/chars.txt', 'w', encoding='utf-8').write(text)

          src_font = '字体/fusion-pixel-12px-proportional-zh_hans.otf.woff2'
          out_font = 'dist/字体/dms-fp.woff2'
          os.makedirs('dist/字体', exist_ok=True)
          
          sys.argv = [
              'pyftsubset', src_font,
              '--text-file=/tmp/chars.txt',
              '--flavor=woff2',
              '--layout-features=*',
              f'--output-file={out_font}'
          ]
          subset_main()

          font = TTFont(out_font)
          for record in font['name'].names:
              if record.nameID in (1, 4, 6, 16):
                  record.string = 'dms-fp'
              elif record.nameID == 0:
                  record.string = 'Copyright (c) 2022, TakWolf & Google. Subsetted by DMS.'
          font.save(out_font)

          css_path = 'dist/css/all.css'
          css = open(css_path, encoding='utf-8').read()
          css = css.replace('fusion-pixel-12px-proportional-zh_hans.otf.woff2', 'dms-fp.woff2')
          css = css.replace('font-family: fusion', 'font-family: dms-fp')
          css = css.replace('font-family:fusion', 'font-family:dms-fp')
          open(css_path, 'w', encoding='utf-8').write(css)

          old_font_in_dist = 'dist/字体/fusion-pixel-12px-proportional-zh_hans.otf.woff2'
          if os.path.exists(old_font_in_dist):
              os.remove(old_font_in_dist)
              print('✅ 已清理旧的原始字体')
          PY

      - name: 安装 critical v9
        run: npm install critical@9 --no-save

      - name: 内联关键 CSS（只提取 #menu 子树）
        run: |
          cd dist
          sed -i 's#<div id="menu">#<div id="menu" data-critical-fold>#' index.html
          grep -q 'data-critical-fold' index.html || { echo 'data-critical-fold 未加上'; exit 1; }
          npx critical index.html --inline --write --engine static
          npx critical index.html --engine static --explain 2>&1 | tail -8

      - name: 将 all.css 改为异步加载
        run: |
          node -e "
            const fs = require('fs');
            let html = fs.readFileSync('dist/index.html', 'utf8');
            
            html = html.replace(/<link[^>]*href=[\"']?css\/all\.css[\"']?[^>]*>/gi, (match) => {
              if (match.includes('preload')) return match;
              return '<link rel=\"stylesheet\" href=\"css/all.css\" media=\"print\" onload=\"this.media=\\'all\\'\"><noscript><link rel=\"stylesheet\" href=\"css/all.css\"></noscript>';
            });
            
            fs.writeFileSync('dist/index.html', html);
            console.log('✅ 已将 all.css 改为异步加载，彻底消除渲染阻塞');
          "

      - name: 注入 dns-prefetch 与 all.js preload
        run: |
          node -e "
            const fs = require('fs');
            const p = 'dist/index.html';
            let html = fs.readFileSync(p, 'utf8');
            const inject = '<link rel=\"dns-prefetch\" href=\"//dms.spldream.com\">' +
                           '<link rel=\"preload\" href=\"js/all.js\" as=\"script\">';
            const idx = html.indexOf('</head>');
            html = html.slice(0, idx) + inject + html.slice(idx);
            fs.writeFileSync(p, html);
            console.log('✅ 注入 dns-prefetch + all.js preload');
          "

      - name: 压缩 HTML
        run: |
          npm install -g html-minifier-terser
          
          html-minifier-terser \
            --remove-attribute-quotes \
            --remove-comments \
            --remove-empty-attributes \
            --remove-optional-tags \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --remove-tag-whitespace \
            --trim-custom-fragments \
            --use-short-doctype \
            --collapse-whitespace \
            --decode-entities \
            --process-conditional-comments \
            --collapse-boolean-attributes \
            dist/index.html -o dist/index.html

      - name: 上传前端打包产物
        uses: actions/upload-artifact@v7
        with:
          name: Web-Production-Build
          path: dist/