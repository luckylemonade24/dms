name: Build Web Assets

on:
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装压缩工具
        run: |
          echo "PUPPETEER_SKIP_DOWNLOAD=true" >> $GITHUB_ENV
          echo "PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true" >> $GITHUB_ENV
          npm install -g terser lightningcss-cli
          npm install critical --no-save

      - name: 合并压缩并生成纯净导出
        run: |
          mkdir -p dist

          grep -oP '(?<=<link rel="stylesheet" href=")[^"]+' index.html | sed 's/?[^ ]*//g' | grep -E '^(css/|add/)' > css_list.txt
          if [ -s css_list.txt ]; then
            mkdir -p dist/css
            cat $(cat css_list.txt) > dist/css/all.css
            sed -i 's|\.\./|/|g' dist/css/all.css
            lightningcss --minify dist/css/all.css -o dist/css/all.css
          fi
          rm -f css_list.txt

          grep -oP '(?<=<script src=")[^"]+' index.html | sed 's/?[^ ]*//g' | grep -E '^(js/|add/)' > js_list.txt
          if [ -s js_list.txt ]; then
            mkdir -p dist/js
            cat $(cat js_list.txt) > dist/js/all.js
            terser dist/js/all.js -c "pure_funcs=['console.log','console.debug']" -m -o dist/js/all.js
          fi
          rm -f js_list.txt

          cp index.html dist/index.html

          sed -i -E 's#<link rel="stylesheet" href="(css/|add/)[^"]*">##g' dist/index.html
          sed -i 's#</head>#<link rel="stylesheet" href="css/all.css">\n</head>#' dist/index.html

          sed -i -E 's#<script src="(js/|add/)[^"]*"[^>]*></script>##g' dist/index.html
          sed -i 's#</body>#<script src="js/all.js" defer></script>\n</body>#' dist/index.html

          cp manifest.webmanifest sw.js dist/
          rsync -av 背景 卡牌 图标 字体 dist/

      - name: 提取并内联关键 CSS
        run: |
          cat > critical-run.mjs <<'EOF'
          import { generate } from 'critical';

          generate({
            inline: true,
            base: 'dist/',
            src: 'index.html',
            target: 'index.html',
            engine: 'static',
            ignore: {
              rule: [
                /^#battle/, /^#deck/, /^#map/, /^#tour/,
                /^#master/, /^#academy/, /^#boss/, /^#runpanel/,
                /^#modal/, /^#toast/, /^body:has/
              ]
            }
          })
          .then(() => console.log('critical done'))
          .catch((e) => { console.error(e); process.exit(1); });
          EOF
          node critical-run.mjs

      - name: 非关键 CSS 改为异步加载
        run: |
          node -e "
            const fs = require('fs');
            const p = 'dist/index.html';
            let s = fs.readFileSync(p, 'utf8');
            s = s.replace(/<link[^>]*href=[\"']css\/all\.css[\"'][^>]*>\s*/gi, '');
            const asyncLink = '<link rel=\"preload\" href=\"css/all.css\" as=\"style\" onload=\"this.onload=null;this.rel=\\'stylesheet\\'\"><noscript><link rel=\"stylesheet\" href=\"css/all.css\"></noscript>';
            s = s.replace('</head>', asyncLink + '</head>');
            fs.writeFileSync(p, s);
            console.log('all.css 已统一为异步加载');
          "

      - name: 上传前端打包产物
        uses: actions/upload-artifact@v4
        with:
          name: Web-Production-Build
          path: dist/