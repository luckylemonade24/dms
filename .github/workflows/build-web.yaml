name: Build Web Assets

on:
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 缓存 Puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-chromium

      - name: 安装压缩工具
        run: |
          npm install -g terser lightningcss-cli critical

      - name: 合并压缩并生成纯净导出
        run: |
          mkdir -p dist

          # ==========================
          # 处理 CSS（保留在 css 目录中）
          # ==========================
          grep -oP '(?<=<link rel="stylesheet" href=")[^"]+' index.html | sed 's/?[^ ]*//g' | grep -E '^(css/|add/)' > css_list.txt
          if [ -s css_list.txt ]; then
            mkdir -p dist/css
            cat $(cat css_list.txt) > dist/css/all.css

            # 把所有的 ../ 路径强行改成绝对根路径 /
            sed -i 's|\.\./|/|g' dist/css/all.css

            lightningcss --minify dist/css/all.css -o dist/css/all.css
          fi
          rm -f css_list.txt

          # ==========================
          # 处理 JS（保留在 js 目录中）
          # ==========================
          grep -oP '(?<=<script src=")[^"]+' index.html | sed 's/?[^ ]*//g' | grep -E '^(js/|add/)' > js_list.txt
          if [ -s js_list.txt ]; then
            mkdir -p dist/js
            cat $(cat js_list.txt) > dist/js/all.js
            # 只删 console.log / console.debug，保留 warn / error
            terser dist/js/all.js -c "pure_funcs=['console.log','console.debug']" -m -o dist/js/all.js
          fi
          rm -f js_list.txt

          # ==========================
          # 修改 index.html 并放入导出目录
          # ==========================
          cp index.html dist/index.html

          # 删掉原本的 css 和 js 引入，替换为合并后的路径
          sed -i -E 's#<link rel="stylesheet" href="(css/|add/)[^"]*">##g' dist/index.html
          sed -i 's#</head>#<link rel="stylesheet" href="css/all.css">\n</head>#' dist/index.html

          sed -i -E 's#<script src="(js/|add/)[^"]*"[^>]*></script>##g' dist/index.html
          sed -i 's#</body>#<script src="js/all.js" defer></script>\n</body>#' dist/index.html

          # 精准拷贝文件
          cp manifest.webmanifest sw.js dist/
          rsync -av 背景 卡牌 图标 字体 dist/

      - name: 提取并内联关键 CSS（render 引擎）
        run: |
          cd dist
          critical index.html --inline --write --engine render --dimensions "390x844,1300x900"

      - name: 上传前端打包产物
        uses: actions/upload-artifact@v4
        with:
          name: Web-Production-Build
          path: dist/