name: Build Web Assets

on:
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装官方压缩工具
        run: |
          npm install -g terser lightningcss-cli

      - name: 提取、合并、极限压缩
        run: |
          mkdir -p dist
          rsync -av --exclude='.git' --exclude='node_modules' --exclude='.github' --exclude='android' --exclude='dist' ./ dist/
          cd dist

          # ==========================
          # 处理 CSS (限定 css/ 和 add/)
          # ==========================
          grep -oP '(?<=<link rel="stylesheet" href=")[^"]+' index.html | sed 's/?[^ ]*//g' | grep -E '^(css/|add/)' > css_list.txt
          
          if [ -s css_list.txt ]; then
            cat $(cat css_list.txt) > all.css
            lightningcss --minify all.css -o all.css
            sed -i -E 's#<link rel="stylesheet" href="(css/|add/)[^"]*">##g' index.html
            sed -i 's#</head>#<link rel="stylesheet" href="all.css">\n</head>#' index.html
          fi
          rm -f css_list.txt

          # ==========================
          # 处理 JS (限定 js/ 和 add/)
          # ==========================
          grep -oP '(?<=<script src=")[^"]+' index.html | sed 's/?[^ ]*//g' | grep -E '^(js/|add/)' > js_list.txt
          
          if [ -s js_list.txt ]; then
            cat $(cat js_list.txt) > all.js
            sed -i -E 's#<script src="(js/|add/)[^"]*"[^>]*></script>##g' index.html
            sed -i 's#</body>#<script src="all.js"></script>\n</body>#' index.html
            
            # ★ 只保留 -m，不要任何 toplevel
            terser all.js -c drop_console=true -m -o all.js
          fi
          rm -f js_list.txt

      - name: 上传前端打包产物
        uses: actions/upload-artifact@v4
        with:
          name: Web-Production-Build
          path: dist/