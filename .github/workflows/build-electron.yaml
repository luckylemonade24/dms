name: Build Windows EXE

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 1. 先清理：只留下 e 骨架，不再保留 server！
      - name: 清理仓库，只保留必需文件
        shell: pwsh
        run: |
          $keep = @("main.js", "package.json", "gen-icon.js")
          Get-ChildItem -Force | Where-Object { $keep -notcontains $_.Name } | Remove-Item -Recurse -Force

      # 2. 拉取前端产物到根目录
      - name: 下载最新的前端构建产物
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: build-web.yaml
          name: Web-Production-Build
          path: .
          if_no_artifact_found: fail

      # ★ 新增：缓存 Electron 二进制包，避免每次重新下载几百 MB
      - name: 缓存 Electron 依赖
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm' # ★ 新增：自动缓存 npm 依赖，不用再手动写 cache 了

      - name: 安装依赖
        run: npm install

      - name: 生成桌面图标
        run: node gen-icon.js

      - name: 打包（只打包，不发布）
        run: npx electron-builder --win nsis portable --publish never

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          draft: true
          files: |
            dist/DungeonDuelist-*-Setup.exe
            dist/DungeonDuelist-*-Setup.exe.blockmap
            dist/DungeonDuelist-*-Portable.exe
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}