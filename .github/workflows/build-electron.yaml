name: Build Windows EXE

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 清理仓库，只保留必需文件
        shell: pwsh
        run: |
          $keep = @("main.js", "package.json", "gen-icon.js")
          Get-ChildItem -Force | Where-Object { $keep -notcontains $_.Name } | Remove-Item -Recurse -Force

      - name: 下载最新的前端构建产物
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: build-web.yaml
          name: Web-Production-Build
          path: .
          if_no_artifact_found: fail

      # ★ 1. 查版本（HTTP 请求，1秒内完成）
      - name: 获取 Electron 实际版本
        id: ev
        shell: pwsh
        run: |
          try {
            $response = Invoke-RestMethod -Uri "https://registry.npmjs.org/electron/latest" -UseBasicParsing
            $v = $response.version
            if ([string]::IsNullOrWhiteSpace($v)) { throw "empty" }
          } catch {
            $v = "latest"
          }
          echo "ver=$v" >> $env:GITHUB_OUTPUT

      # ★ 2. 缓存 Electron
      - name: 缓存 Electron 依赖
        uses: actions/cache@v6
        with:
          path: |
            C:\Users\runneradmin\AppData\Local\electron\Cache
            C:\Users\runneradmin\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ steps.ev.outputs.ver }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      # ★ 3. 缓存 NPM（修正了真实路径 C:\npm\cache）
      - name: 缓存 NPM 依赖
        uses: actions/cache@v6
        with:
          path: C:\npm\cache
          key: ${{ runner.os }}-npm-cache-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-cache-

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: 安装依赖
        run: npm install

      - name: 生成桌面图标
        run: node gen-icon.js

      - name: 打包（只打包，不发布）
        run: npx electron-builder --win nsis portable --publish never

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          draft: true
          files: |
            dist/DungeonDuelist-*-Setup.exe
            dist/DungeonDuelist-*-Setup.exe.blockmap
            dist/DungeonDuelist-*-Portable.exe
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}