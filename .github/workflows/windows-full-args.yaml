name: Dump Full GN Args (Windows)

on:
  workflow_dispatch:

jobs:
  dump-args:
    runs-on: windows-latest
    
    steps:
      - name: 安装 depot_tools
        shell: pwsh
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git .\depot_tools
          echo "${{ github.workspace }}\depot_tools" >> $env:GITHUB_PATH

      - name: 拉取源码
        shell: pwsh
        run: |
          # 写入全局环境变量，后续所有步骤都能读到！彻底解决 401 报错
          echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0" >> $env:GITHUB_ENV
          
          mkdir electron-src
          cd electron-src
          
          gclient config --name src/electron --unmanaged https://github.com/electron/electron.git
          # 绝对不能加 --nohooks，必须生成工具链
          gclient sync --no-history --shallow --with_branch_heads --with_tags -v
        timeout-minutes: 90

      - name: 生成并导出官方参数
        shell: pwsh
        run: |
          cd electron-src/src
          
          # 用变量避免 PowerShell 吞引号，导入官方 release.gn
          $gn_args = 'import("//electron/build/args/release.gn")'
          gn gen out/Release "--args=$gn_args"
          
          # 导出全量参数到文件
          gn args out/Release --list > ..\FULL_GN_ARGS.txt
          Write-Host "参数导出成功，行数: $((Get-Content ..\FULL_GN_ARGS.txt).Count)"

      - name: 上传文件
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-gn-args-windows
          path: electron-src\FULL_GN_ARGS.txt
          if-no-files-found: warn