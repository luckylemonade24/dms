name: Dump Full GN Args (Windows)

on:
  workflow_dispatch:

jobs:
  dump-args:
    runs-on: windows-latest
    
    steps:
      - name: 查看初始磁盘
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,2)}}

      - name: 安装 depot_tools
        shell: pwsh
        run: |
          # 直接装在工作区
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git .\depot_tools
          echo "${{ github.workspace }}\depot_tools" >> $env:GITHUB_PATH

      - name: 拉取源码
        shell: pwsh
        run: |
          # 直接在工作区建文件夹，默认就在 D 盘
          mkdir electron-src
          cd electron-src
          $env:GYP_DEFINES="target_os=win"
          gclient config --name src/electron --unmanaged https://github.com/electron/electron.git
          gclient sync --no-history --shallow --with_branch_heads --with_tags -v
        timeout-minutes: 90

      - name: 生成并导出参数
        shell: pwsh
        run: |
          cd electron-src/src
          gn gen out/Release --args='target_os="win" is_debug=false'
          gn args out/Release --list > ..\FULL_GN_ARGS.txt

      - name: 上传文件
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-gn-args-windows
          path: electron-src\FULL_GN_ARGS.txt
          if-no-files-found: warn