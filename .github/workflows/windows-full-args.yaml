name: Dump Full GN Args (Windows)

on:
  workflow_dispatch:

jobs:
  dump-args:
    runs-on: windows-latest
    
    steps:
      - name: 查看初始磁盘
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,2)}}

      - name: 安装 depot_tools
        shell: pwsh
        run: |
          # 直接装在工作区
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git .\depot_tools
          echo "${{ github.workspace }}\depot_tools" >> $env:GITHUB_PATH

      - name: 拉取源码
        shell: pwsh
        run: |
          mkdir electron-src
          cd electron-src
          $env:GYP_DEFINES="target_os=win"
          # 【新增】强制使用本地 VS 工具链，避免 401 报错
          $env:DEPOT_TOOLS_WIN_TOOLCHAIN="0"
          
          gclient config --name src/electron --unmanaged https://github.com/electron/electron.git
          # 【新增】--nohooks：跳过下载 376MB 的 PGO 文件和各种测试依赖，我们只看参数，不需要这些
          gclient sync --no-history --shallow --with_branch_heads --with_tags --nohooks -v
        timeout-minutes: 90

      - name: 生成并导出参数
        shell: pwsh
        run: |
          cd electron-src/src
          # 生成 GN 配置 (用反引号转义双引号，防止被 PowerShell 吞掉)
          gn gen out/Release --args="target_os=`"win`" is_debug=false"
          # 导出全量参数到文件
          gn args out/Release --list > ..\FULL_GN_ARGS.txt
          Write-Host "参数导出成功，行数: $((Get-Content ..\FULL_GN_ARGS.txt).Count)"

      - name: 上传文件
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-gn-args-windows
          path: electron-src\FULL_GN_ARGS.txt
          if-no-files-found: warn