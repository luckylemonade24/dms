name: Dump Full GN Args (Windows)

on:
  workflow_dispatch:

jobs:
  dump-args:
    runs-on: windows-latest
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0

    steps:
      - name: 安装 depot_tools
        shell: pwsh
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git .\depot_tools
          echo "${{ github.workspace }}\depot_tools" >> $env:GITHUB_PATH

      - name: 拉取源码
        shell: pwsh
        run: |
          mkdir electron-src
          cd electron-src
          gclient config --name src/electron --unmanaged https://github.com/electron/electron.git
          gclient sync --no-history --shallow --with_branch_heads --with_tags -v
        timeout-minutes: 90

      - name: 生成并导出官方参数
        shell: pwsh
        run: |
          cd electron-src/src
          
          # 1. 创建 out 目录
          New-Item -ItemType Directory -Force -Path out/Release | Out-Null
          
          # 2. 把官方配置原封不动地写进 args.gn 文件（使用双引号，绝对不转义）
          Set-Content -Path out/Release/args.gn -Value 'import("//electron/build/args/release.gn")'
          
          # 3. 直接执行生成，GN 会自动读取上面的文件
          gn gen out/Release
          
          # 4. 导出全量参数
          gn args out/Release --list > ..\FULL_GN_ARGS.txt
          Write-Host "参数导出成功，行数: $((Get-Content ..\FULL_GN_ARGS.txt).Count)"

      - name: 上传文件
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-gn-args-windows
          path: electron-src\FULL_GN_ARGS.txt
          if-no-files-found: warn