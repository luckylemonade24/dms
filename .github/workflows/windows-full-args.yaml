name: Dump Full GN Args (Windows)

on:
  workflow_dispatch:

jobs:
  dump-args:
    runs-on: windows-latest
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0

    steps:
      - name: 用 winget 安装指定版本的 Windows SDK
        shell: pwsh
        run: |
          winget install Microsoft.WindowsSDK.10.0.28000 --accept-source-agreements --accept-package-agreements
          
      - name: 安装 depot_tools
        shell: pwsh
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git .\depot_tools
          echo "${{ github.workspace }}\depot_tools" >> $env:GITHUB_PATH

      - name: 拉取源码
        shell: pwsh
        run: |
          mkdir electron-src
          cd electron-src
          
          gclient config --name src/electron --unmanaged https://github.com/electron/electron.git
          gclient sync --no-history --with_branch_heads --with_tags -v
        timeout-minutes: 90

      - name: 强行生成 packed-refs 并导出参数
        shell: pwsh
        run: |
          # 1. 进入 electron 源码目录，强行打包 Git 引用
          cd electron-src/src/electron
          git pack-refs --all
          Write-Host "✅ 成功生成 packed-refs"
          
          # 2. 回到 src 目录生成配置
          cd ..
          
          # 清理残留
          Remove-Item -Recurse -Force out -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path out/Release | Out-Null
          
          # 3. 保留你写死的 SDK 版本
          $argsContent = @(
            'import("//electron/build/args/release.gn")',
            'windows_sdk_version = "10.0.28000.2270"'
          )
          Set-Content -Path out/Release/args.gn -Value $argsContent
          
          # 4. 执行生成
          gn gen out/Release
          
          # 5. 导出全量参数
          gn args out/Release --list > ..\FULL_GN_ARGS.txt
          Write-Host "参数导出成功，行数: $((Get-Content ..\FULL_GN_ARGS.txt).Count)"

      - name: 上传文件
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-gn-args-windows
          path: electron-src\FULL_GN_ARGS.txt
          if-no-files-found: warn