name: build winui3

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish (win-x64, self-contained, unpackaged)
        run: >
          dotnet publish winui3/AtlasCardViewer.csproj
          -c Release
          -r win-x64
          -p:Platform=x64
          -p:WindowsPackageType=None
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:UseXamlCompilerExecutable=false
          -o publish

      - name: Sanity check
        shell: pwsh
        run: |
          if (!(Test-Path "publish/AtlasCardViewer.exe")) { throw "exe 没生成" }
          if (!(Test-Path "publish/卡牌/data.json"))      { throw "data.json 没进输出" }
          if (!(Test-Path "publish/卡牌/texture.webp"))   { throw "texture.webp 没进输出" }

      - uses: actions/upload-artifact@v7
        with:
          name: AtlasCardViewer-win-x64
          path: publish/**
          retention-days: 7