name: Build and Release Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: 安装依赖
        run: npm install

      - name: 生成桌面图标
        run: node gen-icon.js

      - name: 打包（只打包，不发布）
        run: npx electron-builder --win nsis portable --publish never

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          draft: true
          files: |
            dist/DungeonDuelist-*-Setup.exe
            dist/DungeonDuelist-*-Setup.exe.blockmap
            dist/DungeonDuelist-*-Portable.exe
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}