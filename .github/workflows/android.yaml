name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Node.js (用于 sharp 生成图标)
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: 安装依赖 (sharp)
        run: npm install

      - name: 生成安卓图标
        run: node gen-android-icon.js

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2

      - name: 设置 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 只处理 Java 文件，去掉所有兼容逻辑
      - name: 自动根据包名整理代码目录
        run: |
          PKG_NAME=$(grep 'namespace = ' android/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          PKG_DIR=$(echo $PKG_NAME | tr '.' '/')
          echo "检测到包名: $PKG_NAME，自动生成目录: $PKG_DIR"
          
          mkdir -p android/app/src/main/java/$PKG_DIR
          
          if [ -f "android/app/src/main/java/MainActivity.java" ]; then
            mv android/app/src/main/java/MainActivity.java android/app/src/main/java/$PKG_DIR/MainActivity.java
            echo "MainActivity.java 已自动归位！"
          fi

      - name: 准备本地前端资源到 assets
        run: |
          mkdir -p android/app/src/main/assets/www
          rsync -av --exclude='.git' --exclude='node_modules' --exclude='.github' \
            --exclude='android' --exclude='package.json' --exclude='main.js' --exclude='server' \
            ./ android/app/src/main/assets/www/

      - name: 构建 Android 项目
        run: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle assembleRelease

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: DungeonDuelist-Android
          path: android/app/build/outputs/apk/release/app-release.apk