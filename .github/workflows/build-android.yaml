name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 清理仓库，只保留安卓工程
        run: |
          find . -maxdepth 1 -mindepth 1 ! -name 'android' -exec rm -rf {} +

      - name: 下载最新的前端构建产物
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: build-web.yaml
          name: Web-Production-Build
          path: android/app/src/main/assets/www
          if_no_artifact_found: fail

      - name: 设置 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.8.2

      - name: 设置 Gradle 缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 自动根据包名整理代码目录
        run: |
          PKG_NAME=$(grep 'namespace = ' android/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          PKG_DIR=$(echo $PKG_NAME | tr '.' '/')
          mkdir -p android/app/src/main/java/$PKG_DIR
          if [ -f "android/app/src/main/java/MainActivity.java" ]; then
            mv android/app/src/main/java/MainActivity.java android/app/src/main/java/$PKG_DIR/MainActivity.java
          fi

      # ★ 新增：解码签名文件并构建
      - name: 构建 Android 项目
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          cd android
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/release.p12
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle assembleRelease

      - name: 读取版本名（打 Tag 用）
        id: ver
        run: |
          V=$(grep -oP 'val appVersionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: 发布 Release 草稿
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          draft: true
          files: |
            android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}