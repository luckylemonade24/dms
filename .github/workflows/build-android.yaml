name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # 1. 先清理：只留安卓工程、图标脚本和图标资源
      - name: 清理仓库，只保留必需文件
        run: |
          find . -maxdepth 1 -mindepth 1 ! -name 'android' ! -name 'gen-android-icon.js' ! -name '图标' ! -name '.git' -exec rm -rf {} +

      # 2. 再拉取：直接下载到安卓的 assets/www 目录
      - name: 下载最新的前端构建产物
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-web.yaml
          name: Web-Production-Build
          path: android/app/src/main/assets/www
          if_no_artifact_found: fail

      - name: 设置 Node.js (用于 sharp 生成图标)
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: 安装依赖 (sharp)
        run: npm install

      - name: 生成安卓图标
        run: node gen-android-icon.js

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2

      - name: 设置 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 自动根据包名整理代码目录
        run: |
          PKG_NAME=$(grep 'namespace = ' android/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          PKG_DIR=$(echo $PKG_NAME | tr '.' '/')
          mkdir -p android/app/src/main/java/$PKG_DIR
          if [ -f "android/app/src/main/java/MainActivity.java" ]; then
            mv android/app/src/main/java/MainActivity.java android/app/src/main/java/$PKG_DIR/MainActivity.java
          fi

      - name: 构建 Android 项目
        run: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle assembleRelease

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: DungeonDuelist-Android
          path: android/app/build/outputs/apk/release/app-release.apk